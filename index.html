function save(){try{localStorage.setItem('nexus-save',JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('nexus-save'));if(s&&s.players?.length===5)state={...state,...s,matchTimer:null}}catch(e){}}
function rowPlayers(){return state.players.map(p=>`<div class="player-row"><div class="player-icon">${p.icon}</div><div><div class="player-name">${p.name}</div><div class="player-role">${p.role}</div></div><div class="form-dots">${[0,1,2,3,4].map(i=>`<i class="${i<p.form?'good':''}"></i>`).join('')}</div><div class="skill">${p.skill} <span style="color:#70808b;font-size:9px">OVR</span></div></div>`).join('')}
function leagueData(){return teams.map((team,i)=>{const wins=i===0?state.wins:Math.max(0,Math.round((state.week-1)*.52)-Math.floor((i-1)/2));const losses=i===0?state.losses:Math.max(0,state.week-1-wins);return{team,wins,losses,points:wins*3}}).sort((a,b)=>b.points-a.points||b.wins-a.wins)}
function rankOf(short){return leagueData().findIndex(entry=>entry.team.short===short)+1}
function ordinal(n){return n+(n%100>=11&&n%100<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))}
function standingRows(){return leagueData().map((entry,i)=>`<div class="standing-row ${entry.team.short==='EMB'?'you':''}"><span class="standing-rank">${String(i+1).padStart(2,'0')}</span><span class="standing-name">${entry.team.short==='EMB'?'✦ ':''}${entry.team.name}</span><span class="standing-record">${entry.wins}-${entry.losses}</span><span class="standing-points">${entry.points}</span></div>`).join('')}
function homePage(){const opp=currentOpponent();return `<div class="page"><div class="heading-row"><div><div class="eyebrow">YOUR CLUB · 2025 SEASON</div><h1 class="page-title">Good morning, Manager.</h1><p class="page-sub">The next play is yours to make.</p></div><div class="right-tag">RECORD <b>${state.wins}W — ${state.losses}L</b></div></div><div class="grid-main"><div><article class="card"><div class="match-banner"><div class="match-top"><div class="live-pill">UP NEXT</div><time>WEEK ${String(state.week).padStart(2,'0')} · REGULAR SEASON</time></div><div class="versus"><div class="team-side"><div class="team-badge">E</div><div class="team-name">EMBER FIVE</div><div class="team-rank">${ordinal(rankOf('EMB')).toUpperCase()} IN LEAGUE</div></div><div class="vs">VS</div><div class="team-side"><div class="team-badge enemy">${opp.short[0]}</div><div class="team-name">${opp.name}</div><div class="team-rank">${ordinal(rankOf(opp.short)).toUpperCase()} IN LEAGUE</div></div></div><div class="match-foot"><div>BEST OF <b>3</b> <span style="color:#66747c">·</span> <b>PLAYOFF POINTS</b></div><button class="primary" onclick="openDraft()">${state.played?'ADVANCE WEEK':'PREPARE MATCH'} &nbsp;→</button></div></div></article><article class="card roster-card"><div class="card-head"><span class="card-title">STARTING FIVE</span><button class="text-btn" onclick="navigate('roster')">MANAGE ROSTER ↗</button></div><div class="roster-list">${rowPlayers()}</div></article></div><div class="right-stack"><article class="card"><div class="card-head"><span class="card-title">SPLIT STANDINGS</span><span class="card-kicker">TOP 6</span></div><div class="standings">${standingRows()}</div></article><article class="card news-card"><div class="card-head"><span class="card-title">SCENE REPORT</span><span class="card-kicker">✦ NEWS</span></div><div class="news-body"><div class="news-date">NEXUS DAILY · 09:00 AM</div><p>${state.week===1?'EMBER FIVE open their season against '+currentOpponent().name+'. Analysts are watching the squad’s new mid-lane synergy.':'Split week '+String(state.week).padStart(2,'0')+' is underway. Ember Five are '+(state.wins>=state.losses?'building momentum':'looking to bounce back')+'—can they make the playoff push?'}</p></div></article><article class="card"><div class="card-head"><span class="card-title">SEASON OBJECTIVE</span><span class="card-kicker">REWARD ◈ 2,000</span></div><div class="objective"><div class="objective-top"><span>Win 4 regular-season matches</span><b>${state.wins}/4</b></div><div class="progress"><i style="width:${Math.min(100,state.wins*25)}%"></i></div><small>${state.wins>=4?'Objective complete!':'Every win earns 3 league points'}</small></div></article></div></div></div>`}
function rosterPage(){return `<div class="page"><div class="heading-row"><div><div class="eyebrow">THE PEOPLE BEHIND THE PLAYS</div><h1 class="page-title">Your roster.</h1><p class="page-sub">Train your squad and keep their form sharp.</p></div><div class="toolbar"><span class="right-tag">WEEKLY TRAINING <b>◈ 350</b></span></div></div><div class="roster-full">${state.players.map((p,i)=>`<article class="card player-card"><div class="player-top"><div class="player-big">${p.icon}</div><div><h3>${p.name}</h3><small>${p.role} · ${p.morale}% MORALE</small></div><div class="player-rating">${p.skill}</div></div><div class="stat-line"><div class="stat"><small>MECHANICS</small><b>${Math.min(99,p.skill+3)}</b></div><div class="stat"><small>TEAMWORK</small><b>${Math.max(55,p.morale+2)}</b></div><div class="stat"><small>FORM</small><b>${p.form}/5</b></div></div><div class="player-actions"><span>Training improves skill & form</span><button class="training-btn" onclick="train(${i})" ${state.cash<350||p.skill>=99?'disabled':''}>TRAIN · ◈350</button></div></article>`).join('')}</div><div class="tactic-note">✦ &nbsp; Keep morale high: wins lift spirits, while losing streaks can hurt form. Training is a quick way to build your squad’s edge.</div></div>`}
function tacticsPage(){const tactics=[['balanced','Balanced','Reliable in every phase. No weaknesses, no easy wins.','EVEN'],['aggressive','Aggressive','Early pressure creates more fights—and more risk.','+18% DAMAGE'],['scaling','Scale up','Play safe early. Your late-game carries get stronger.','+20% LATE']];const focuses=[['adapt','Read & react','Flexible drafting gives a bonus against enemy comfort picks.'],['teamfight','Team fights','Better at grouped fights and objective contests.'],['objectives','Objective control','Prioritize neutral objectives and map pressure.']];return `<div class="page"><div class="heading-row"><div><div class="eyebrow">MAKE EVERY DECISION COUNT</div><h1 class="page-title">Set your strategy.</h1><p class="page-sub">Your game plan shapes how every match plays out.</p></div></div><div class="tactics-grid"><article class="card tactic-card"><h3>Play style</h3><p>Choose your team's risk profile for the match.</p><div class="option-list">${tactics.map(([id,n,d,b])=>`<button class="option ${state.tactic===id?'selected':''}" onclick="setTactic('tactic','${id}')"><span><b>${n}</b><small>${d}</small></span><i>${b}</i></button>`).join('')}</div></article><article class="card tactic-card"><h3>Coaching focus</h3><p>What does your coaching staff drill this week?</p><div class="option-list">${focuses.map(([id,n,d])=>`<button class="option ${state.focus===id?'selected':''}" onclick="setTactic('focus','${id}')"><span><b>${n}</b><small>${d}</small></span><i>${id===state.focus?'ACTIVE':'+'+({adapt:'DRAFT',teamfight:'FIGHTS',objectives:'MAP'}[id])}</i></button>`).join('')}</div><div class="tactic-note">Training focus shifts each week and grants a unique edge in your next matchup.</div></article></div></div>`}
function leaguePage(){const rows=Array.from({length:10},(_,i)=>{const week=i+1;let name=teams[((week-1)%(teams.length-1))+1].name;const result=state.results[week-1];return `<div class="fixture"><div class="fixture-week">WEEK ${String(week).padStart(2,'0')}</div><div class="fixture-name">EMBER FIVE <small>${week<=state.week?'vs.':'VS.'} ${name}</small></div><div class="fixture-result ${result===true?'win':result===false?'loss':''}">${result===true?'VICTORY':result===false?'DEFEAT':week===state.week&&!state.played?'UP NEXT':'—'}</div></div>`}).join('');return `<div class="page"><div class="heading-row"><div><div class="eyebrow">THE ROAD TO PLAYOFFS</div><h1 class="page-title">League & schedule.</h1><p class="page-sub">Ten weeks. Six teams. One champion.</p></div><div class="right-tag">${Math.min(10,state.week-1)}/10 <b>WEEKS PLAYED</b></div></div><div class="league-layout"><article class="card"><div class="card-head"><span class="card-title">REGULAR SEASON FIXTURES</span><span class="card-kicker">SPLIT 01</span></div><div class="schedule">${rows}</div></article><article class="card"><div class="card-head"><span class="card-title">LEAGUE TABLE</span><span class="card-kicker">POINTS</span></div><div class="standings">${standingRows()}</div></article></div></div>`}
function render(){document.querySelector('#page-home').innerHTML=homePage();document.querySelector('#page-roster').innerHTML=rosterPage();document.querySelector('#page-tactics').innerHTML=tacticsPage();document.querySelector('#page-league').innerHTML=leaguePage();document.querySelector('#cash').textContent=fmt(state.cash);document.querySelector('#sideMorale').textContent=state.morale+'%';document.querySelector('#topWeek').textContent='WEEK '+String(state.week).padStart(2,'0');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='page-'+state.page));save()}
function navigate(page){state.page=page;render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function train(i){const p=state.players[i];if(state.cash<350||p.skill>=99)return;state.cash-=350;p.skill=Math.min(99,p.skill+1);p.form=Math.min(5,p.form+1);p.morale=Math.min(99,p.morale+2);state.morale=Math.round(state.players.reduce((a,p)=>a+p.morale,0)/5);render();toast(`${p.name} improved! +1 skill, +1 form`)}
function setTactic(which,val){state[which]=val;render();toast(which==='tactic'?'Play style updated':'Coaching focus updated')}
function openDraft(){if(state.played){advanceWeek();return}state.draft=[];state.bans=[];state.champPool=CHAMPS.map(c=>c.n);openModal();renderDraft()}
function openModal(){document.querySelector('#modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){if(state.matchTimer)return;document.querySelector('#modal').classList.remove('open');document.body.style.overflow='';}
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!state.matchTimer)closeModal()});
function renderDraft(){const modal=document.querySelector('#modalBody');const count=state.draft.length;const phase=count<3?'PICK YOUR CHAMPIONS':'READY TO PLAY';const prompt=count===0?'Pick your first champion':count===1?'Choose your second champion':'Choose a final champion for your lineup';modal.innerHTML=`<div class="modal-head"><h2>Match prep <span style="color:var(--muted);font-weight:400">/ Week ${state.week}</span></h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-content"><div class="draft-stage"><div><div class="draft-step">${phase}</div><p>${count<3?prompt:'Your lineup is locked in. The arena awaits.'}</p></div><div class="draft-score">${count}/3 PICKS</div></div><div class="champion-grid">${CHAMPS.map(c=>`<button class="champion ${state.draft.includes(c.n)?'selected':''} ${state.bans.includes(c.n)?'banned':''}" onclick="pickChampion('${c.n}')"><span class="champion-emoji">${c.e}</span><b>${c.n}</b><small>${c.r}</small></button>`).join('')}</div><div class="draft-bottom"><div class="draft-progress">${count<3?'PICK 3 CHAMPIONS TO COMPLETE YOUR DRAFT':`YOUR PICKS: ${state.draft.join(' · ')}`}</div><button class="primary" ${count<3?'disabled':''} onclick="startMatch()">ENTER THE ARENA →</button></div></div>`}
function pickChampion(name){if(state.draft.length>=3)return;if(state.draft.includes(name))state.draft=state.draft.filter(n=>n!==name);else state.draft.push(name);renderDraft()}
let roundWins=[0,0],roundNo=1;
function startMatch(){if(state.draft.length<3)return;roundWins=[0,0];roundNo=1;state.matchTick=0;state.blueKills=0;state.redKills=0;state.speed=1;renderMatch();state.matchTimer=setInterval(matchTick,1000/state.speed)}
function renderMatch(){const opponent=currentOpponent();document.querySelector('#modalBody').innerHTML=`<div class="modal-head"><h2>EMBER FIVE <span style="color:var(--muted);font-weight:400">vs.</span> ${opponent.name}</h2><button class="close" onclick="leaveMatch()">×</button></div><div class="match-content"><div class="match-meta"><b>GAME ${roundNo} OF 3 <span style="color:var(--muted);font-weight:400">· BEST OF 3</span></b><span id="matchClock">00:${String(Math.min(59,state.matchTick*2)).padStart(2,'0')}</span></div><div class="arena"><div class="arena-grid"></div><div class="tower left"></div><div class="tower right"></div><div class="arena-score"><b>${roundWins[0]}</b> &nbsp; <span style="color:#7d8c8d">${state.blueKills} — ${state.redKills}</span> &nbsp; <span class="enemy-score">${roundWins[1]}</span></div><div id="units"></div><div class="arena-status" id="arenaStatus">TEAMS ARE MOVING INTO POSITION</div></div><div class="match-meta"><b>LIVE COMMS</b><span>GAME ${roundNo} · ${state.tactic.toUpperCase()}</span></div><div class="match-log" id="matchLog"><div class="log-line"><span class="log-time">00:00</span>Both teams enter the Rift. Draft locked: ${state.draft.join(', ')}.</div></div><div class="match-controls"><div class="speed-controls"><button class="on" onclick="setSpeed(1,this)">1×</button><button onclick="setSpeed(2,this)">2×</button><button onclick="setSpeed(4,this)">4×</button></div><span style="font:9px var(--mono);color:var(--muted)">AUTO-SIMULATING</span><button class="secondary" onclick="skipMatch()">SKIP TO RESULT »</button></div></div>`;drawUnits()}
function drawUnits(){const box=document.querySelector('#units');if(!box)return;const icons=['⚔','✦','◈','⬟','✧'];const tick=state.matchTick;box.innerHTML=Array.from({length:5},(_,i)=>{const allyX=14+((tick*5+i*13)%31),foeX=86-((tick*4+i*11)%31),y=26+((i*17+tick*3)%54);return `<div class="unit ally" style="left:${allyX}%;top:${y}%">${icons[i]}</div><div class="unit foe" style="left:${foeX}%;top:${100-y-12}%">${['✹','◉','❖','✶','⬢'][i]}</div>`}).join('')}
function addLog(text){const log=document.querySelector('#matchLog');if(!log)return;log.insertAdjacentHTML('beforeend',`<div class="log-line"><span class="log-time">00:${String(Math.min(59,state.matchTick*2)).padStart(2,'0')}</span>${text}</div>`);log.scrollTop=log.scrollHeight}
function setSpeed(speed,button){state.speed=speed;document.querySelectorAll('.speed-controls button').forEach(b=>b.classList.remove('on'));button.classList.add('on');if(state.matchTimer){clearInterval(state.matchTimer);state.matchTimer=setInterval(matchTick,1000/state.speed)}}
function teamPower(){const avg=state.players.reduce((a,p)=>a+p.skill+(p.form-3)*2+(p.morale-70)*.08,0)/5;let bonus=state.tactic==='aggressive'?3:state.tactic==='scaling'?1:0;bonus+=state.focus==='adapt'?2:state.focus==='teamfight'?2:1;bonus+=state.draft.reduce((a,n)=>a+(['Moss','Echo','Rook'].includes(n)?1.5:0),0);return avg+bonus}
function matchTick(){state.matchTick++;const power=teamPower();const aggression=state.tactic==='aggressive'?1.24:state.tactic==='scaling'?(state.matchTick>11?1.2:.81):1;const allyChance=Math.min(.76,.39+(power-82)*.018)*aggression;const enemyChance=.45+(Math.random()*.09);let event='';if(Math.random()<allyChance*.48){state.blueKills++;event=`${state.players[Math.floor(Math.random()*5)].name} finds an opening! Ember Five secure a takedown.`}else if(Math.random()<enemyChance*.4){state.redKills++;event=`${currentOpponent().short} strike back with a clean pick.`}else if(state.matchTick%4===0)event=state.matchTick>12?'Both teams group for the final objective.':'Teams trade vision across the map.';if(event)addLog(event);const clock=document.querySelector('#matchClock');if(clock)clock.textContent=`00:${String(Math.min(59,state.matchTick*2)).padStart(2,'0')}`;const status=document.querySelector('#arenaStatus');if(status)status.textContent=state.matchTick>13?'CONTESTING THE NEXUS':'FIGHTING FOR MAP CONTROL';const score=document.querySelector('.arena-score');if(score)score.innerHTML=`<b>${roundWins[0]}</b> &nbsp; <span style="color:#7d8c8d">${state.blueKills} — ${state.redKills}</span> &nbsp; <span class="enemy-score">${roundWins[1]}</span>`;drawUnits();if(state.blueKills>=7||state.redKills>=7||state.matchTick>=18)finishRound()}
function finishRound(){clearInterval(state.matchTimer);state.matchTimer=null;let ours=state.blueKills+(teamPower()-82)*.14+Math.random()*2;let theirs=state.redKills+Math.random()*2;if(ours===theirs)ours+=Math.random()-.5;const won=ours>theirs;roundWins[won?0:1]++;addLog(won?'EMBER FIVE destroy the Nexus! Game secured.':`${currentOpponent().short} take the game. Reset and refocus.`);if(roundWins[0]===2||roundWins[1]===2||roundNo===3){finishSeries(roundWins[0]>roundWins[1]);return}roundNo++;state.matchTimer=setTimeout(()=>{if(!document.querySelector('#modal').classList.contains('open')){state.matchTimer=null;return}state.matchTick=0;state.blueKills=0;state.redKills=0;renderMatch();state.matchTimer=setInterval(matchTick,1000/state.speed);addLog('Next game begins. Resetting the draft and returning to lane.')},1700)}
function finishSeries(won){clearInterval(state.matchTimer);state.matchTimer=null;state.played=true;state.lastResult=won;state.results[state.week-1]=won;if(won){state.wins++;state.cash+=1200;state.fans+=Math.floor(90+Math.random()*70);state.morale=Math.min(99,state.morale+4);state.players.forEach(p=>{p.form=Math.min(5,p.form+(Math.random()<.65?1:0));p.morale=Math.min(99,p.morale+3)})}else{state.losses++;state.cash+=550;state.fans=Math.max(500,state.fans-35);state.morale=Math.max(45,state.morale-5);state.players.forEach(p=>{p.form=Math.max(1,p.form-(Math.random()<.4?1:0));p.morale=Math.max(45,p.morale-3)})}render();const opponent=currentOpponent();document.querySelector('#modalBody').innerHTML=`<div class="modal-head"><h2>Series complete <span style="color:var(--muted);font-weight:400">/ Week ${state.week}</span></h2><button class="close" onclick="closeModal()">×</button></div><div class="result-banner"><div class="result-icon">${won?'🏆':'💥'}</div><div class="eyebrow">${won?'MATCH VICTORY':'MATCH DEFEAT'}</div><h2 style="color:${won?'var(--lime)':'var(--red)'}">${won?'EMBER FIVE TAKE THE SERIES':'A TOUGH SERIES'}</h2><p>EMBER FIVE ${roundWins[0]} — ${roundWins[1]} ${opponent.name}</p><div class="result-stats"><div><b>${won?'+1,200':' +550'}</b>PRIZE MONEY</div><div><b>${won?'+3':'—'}</b>LEAGUE POINTS</div><div><b>${fmt(state.fans)}</b>FANS</div></div><button class="primary" onclick="closeModal()">BACK TO CLUBHOUSE →</button></div>`;save()}
function skipMatch(){if(!state.matchTimer)return;clearInterval(state.matchTimer);clearTimeout(state.matchTimer);state.matchTimer=null;while(roundWins[0]<2&&roundWins[1]<2){roundNo++;const edge=(teamPower()-82)*.018+(state.tactic==='aggressive'?.025:0);const ours=Math.random()<(.51+edge);roundWins[ours?0:1]++;}finishSeries(roundWins[0]>roundWins[1])}
function leaveMatch(){if(state.matchTimer){if(!confirm('Leave the live match? Your current game will be forfeited.'))return;clearInterval(state.matchTimer);state.matchTimer=null;finishSeries(false);return}closeModal()}
function advanceWeek(){if(state.week>=10){state.week=1;state.wins=0;state.losses=0;state.results=[];state.played=false;state.fans+=300;state.cash+=2500;state.focus='adapt';toast('Split complete! New season begins. +◈2,500');}else{state.week++;state.played=false;state.cash=Math.max(0,state.cash-state.players.reduce((a,p)=>a+p.salary,0));state.focus='adapt';}render();if(state.week>1)toast(`Week ${state.week} begins · player salaries paid`)}
load();render();
</script>
</body>
</html>
